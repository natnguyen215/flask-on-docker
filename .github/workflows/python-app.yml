name: Development Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and start development services
        run: docker compose up --build -d

      - name: Verify webpage
        run: |
          for i in {1..30}; do
            if curl --fail http://localhost:5001/; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Stop services
        if: always()
        run: docker compose down -v
